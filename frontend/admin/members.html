<!DOCTYPE html>
<html lang="vi" data-theme="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thành viên — Quản trị CLB IP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/variables.css">
  <link rel="stylesheet" href="/frontend/css/base.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
  <style>
    /* ---- Layout riêng trang thành viên ---- */
    .toolbar {
      display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
    }
    .toolbar .form-select, .toolbar .form-input { width: auto; }
    .toolbar-spacer { flex: 1; }
    @media (max-width: 767.98px) {
      .toolbar .form-select, .toolbar .form-input { width: 100%; }
      .toolbar-spacer { display: none; }
    }

    /* ---- Hồ sơ 360° ---- */
    .p360-head { display: flex; align-items: center; gap: var(--s-4); margin-bottom: var(--s-5); }
    .p360-stats {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s-3);
      margin-bottom: var(--s-5);
    }
    @media (max-width: 639.98px) { .p360-stats { grid-template-columns: repeat(2, 1fr); } }
    .p360-stat {
      background: var(--bg-subtle); border-radius: var(--r-control);
      padding: 10px 12px; text-align: center;
    }
    .p360-stat .v { font-weight: 800; font-size: var(--text-md); font-variant-numeric: tabular-nums; }
    .p360-stat .l { font-size: var(--text-xs); color: var(--tx-muted); margin-top: 2px; }
    .p360-section-title { font-size: var(--text-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tx-muted); margin: var(--s-4) 0 var(--s-2); }
    .xp-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: 8px 0; border-bottom: 1px dashed var(--border-color); font-size: var(--text-sm); }
    .xp-row:last-child { border-bottom: 0; }
    .xp-plus { color: var(--c-success); font-weight: 700; }
    .xp-minus { color: var(--c-danger); font-weight: 700; }
    .board-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border-strong); border-radius: var(--r-pill);
      padding: 4px 12px; font-size: var(--text-xs); font-weight: 600;
      color: var(--tx-secondary); margin: 0 var(--s-2) var(--s-2) 0;
    }

    /* ---- Số tiền dương/âm trong bảng ---- */
    .amt-in  { color: var(--c-success); font-weight: 700; }
    .xp-badge { color: var(--c-accent); font-weight: 800; font-variant-numeric: tabular-nums; }

    /* ---- Chọn thành viên (gán chức vụ) ---- */
    .picked-member {
      display: flex; align-items: center; gap: var(--s-2);
      background: var(--c-accent-soft); color: var(--c-accent);
      border-radius: var(--r-control); padding: 8px 12px;
      font-size: var(--text-sm); font-weight: 600; margin-top: var(--s-2);
    }

    /* ---- Kết quả import ---- */
    .import-result { border: 1px dashed var(--border-strong); border-radius: var(--r-control); padding: var(--s-3); font-size: var(--text-sm); }
    .import-result .err-line { color: var(--c-danger); }
  </style>
</head>
<body>
<div class="admin-shell" id="shell">
  <aside class="admin-sidebar">
    <div class="side-brand">
      <span class="logo" id="brand-logo"></span>
      <div><div class="t1">CLB IP ĐHSP Huế</div><div class="t2">Quản trị 2.0</div></div>
    </div>
    <nav class="side-nav" id="side-nav"><!-- JS render nav --></nav>
    <div class="side-foot">
      <button class="btn btn-ghost w-100" id="btn-logout" style="color:var(--tx-sidebar)">Đăng xuất</button>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="flex items-center gap-3">
        <button class="btn btn-ghost burger" id="btn-burger" aria-label="Mở menu"><span id="burger-icon"></span></button>
        <h1 style="font-size:var(--text-lg)">Quản lý thành viên</h1>
      </div>
      <div class="flex items-center gap-3" id="topbar-user"><!-- avatar + tên --></div>
    </header>
    <main class="admin-content">

      <!-- ===== Toolbar: tìm kiếm Trie + lọc + hành động ===== -->
      <section class="toolbar" aria-label="Công cụ tìm kiếm và lọc">
        <div class="searchbar autocomplete">
          <span id="ic-search"></span>
          <input class="form-input" type="text" id="inp-search"
                 placeholder="Tìm theo tên / MSSV / lớp…" autocomplete="off">
          <div class="ac-list hidden" id="ac-members"></div>
        </div>
        <select class="form-select" id="f-lop" aria-label="Lọc theo lớp">
          <option value="">Tất cả lớp</option>
        </select>
        <select class="form-select" id="f-trang-thai" aria-label="Lọc theo trạng thái">
          <option value="">Mọi trạng thái</option>
          <option value="ACTIVE">Đang hoạt động</option>
          <option value="INACTIVE">Ngừng hoạt động</option>
          <option value="LEAVE">Bảo lưu</option>
        </select>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-outline" id="btn-import"><span id="ic-import"></span>Nhập Excel</button>
        <button class="btn btn-outline" id="btn-export"><span id="ic-export"></span>Xuất Excel</button>
        <button class="btn btn-primary" id="btn-add"><span id="ic-add"></span>Thêm thành viên</button>
      </section>

      <!-- ===== Tabs ===== -->
      <nav class="tabs" aria-label="Nhóm danh sách">
        <button class="tab active" data-tab="members">Thành viên</button>
        <button class="tab" data-tab="board">Ban chủ nhiệm</button>
      </nav>

      <!-- ===== Tab 1: bảng thành viên ===== -->
      <section id="pane-members">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Thành viên</th><th>MSSV</th><th>Lớp</th><th>SĐT</th>
                <th>Email</th><th class="num">XP</th><th>Trạng thái</th><th class="actions">Hành động</th>
              </tr>
            </thead>
            <tbody id="members-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="members-pagination">
          <span class="page-info"></span><span class="page-btns"></span>
        </div>
      </section>

      <!-- ===== Tab 2: ban chủ nhiệm ===== -->
      <section id="pane-board" class="hidden">
        <div class="flex items-center justify-between gap-3 wrap mb-4">
          <p class="small muted" style="margin:0">Cơ cấu Ban chủ nhiệm theo nhiệm kỳ.</p>
          <button class="btn btn-primary btn-sm" id="btn-assign"><span id="ic-assign"></span>Gán chức vụ</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>Thành viên</th><th>MSSV</th><th>Chức vụ</th><th>Ban phụ trách</th><th>Nhiệm kỳ</th></tr>
            </thead>
            <tbody id="board-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/icons.js"></script>
<script src="/frontend/js/toast.js"></script>
<script src="/frontend/js/utils.js"></script>
<script src="/frontend/js/auth.js"></script>
<script>
(function () {
  "use strict";

  /* ================= NAV DÙNG CHUNG (CONTRACT §6) ================= */
  function renderAdminNav(active) {
    document.getElementById("brand-logo").innerHTML = Icons.render("zap", 20);
    const items = [
      ["dashboard", "layout", "Dashboard", "/frontend/admin/dashboard.html"],
      ["members", "users", "Thành viên", "/frontend/admin/members.html"],
      ["funds", "wallet", "Quỹ CLB", "/frontend/admin/funds.html"],
      ["events", "calendar", "Sự kiện", "/frontend/admin/events.html"],
      ["attendance", "compass", "Điểm danh", "/frontend/admin/attendance.html"],
      ["documents", "book-open", "Tài liệu", "/frontend/admin/documents.html"],
    ];
    document.getElementById("side-nav").innerHTML =
      '<div class="nav-label">Quản lý</div>' +
      items.map(([k, ic, label, href]) =>
        `<a class="nav-item${k === active ? " active" : ""}" href="${href}">${Icons.render(ic, 18)}<span>${label}</span></a>`
      ).join("");
    const user = Auth.cachedUser();
    document.getElementById("topbar-user").innerHTML =
      `<span class="small bold">${Utils.escapeHtml(user?.ho_ten || user?.email || "")}</span>
       <span class="avatar avatar-sm" title="${Utils.escapeHtml(user?.role || "")}">${Utils.initials(user?.ho_ten || user?.email)}</span>`;
    document.getElementById("burger-icon").innerHTML = Icons.render("menu", 20);
    document.getElementById("btn-burger").addEventListener("click", () => {
      document.getElementById("shell").classList.add("nav-open");
      document.getElementById("scrim").classList.remove("hidden");
    });
    document.getElementById("scrim").addEventListener("click", () => {
      document.getElementById("shell").classList.remove("nav-open");
      document.getElementById("scrim").classList.add("hidden");
    });
    document.getElementById("btn-logout").addEventListener("click", () => Auth.logout());
  }

  /* ================= MODAL HELPER (CONTRACT §7) ================= */
  function openModal({ title, bodyHTML, onMount, footerHTML = "" }) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="${Utils.escapeHtml(title)}">
        <div class="modal-head"><h3>${Utils.escapeHtml(title)}</h3>
          <button class="modal-close">${Icons.render("x", 20)}</button></div>
        <div class="modal-body">${bodyHTML}</div>
        ${footerHTML ? `<div class="modal-foot">${footerHTML}</div>` : ""}
      </div>`;
    const close = () => backdrop.remove();
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
    backdrop.querySelector(".modal-close").addEventListener("click", close);
    document.body.appendChild(backdrop);
    if (onMount) onMount(backdrop, close);
    return { el: backdrop, close };
  }
  function showFieldErrors(root, errors) {
    if (!errors || typeof errors !== "object") return;
    Object.entries(errors).forEach(([field, msgs]) => {
      const el = root.querySelector(`.form-error[data-field="${field}"]`);
      if (el) { el.textContent = Array.isArray(msgs) ? msgs.join(" ") : String(msgs); el.classList.remove("hidden"); }
    });
  }
  function clearFieldErrors(root) {
    Utils.qsa(".form-error", root).forEach((el) => { el.textContent = ""; el.classList.add("hidden"); });
  }

  /* ================= HẰNG SỐ HIỂN THỊ ================= */
  const TRANG_THAI = { ACTIVE: ["Đang hoạt động", "success"], INACTIVE: ["Ngừng hoạt động", "neutral"], LEAVE: ["Bảo lưu", "warning"] };
  const GIOI_TINH = { NAM: "Nam", NU: "Nữ", KHAC: "Khác" };
  const CHUC_VU = { CHU_NHIEM: "Chủ nhiệm", PHO_CHU_NHIEM: "Phó chủ nhiệm", TRUONG_BAN: "Trưởng ban", PHO_BAN: "Phó ban" };
  const BAN_PT = { HOC_THUAT: "Ban Học thuật", TRUYEN_THONG: "Ban Truyền thông", SU_KIEN: "Ban Sự kiện", TAI_CHINH: "Ban Tài chính" };
  const ic = (n, s) => Icons.render(n, s || 18);

  /* ================= STATE ================= */
  const state = { page: 1, search: "", lop: "", trangThai: "" };

  /* ================= KHỞI TẠO ================= */
  function init() {
    renderAdminNav("members");
    renderStaticIcons();
    bindToolbar();
    bindTabs();
    loadMembers();
    loadBoard();
  }

  function renderStaticIcons() {
    document.getElementById("ic-search").innerHTML = ic("search", 17);
    document.getElementById("ic-import").innerHTML = ic("upload", 16);
    document.getElementById("ic-export").innerHTML = ic("download", 16);
    document.getElementById("ic-add").innerHTML = ic("user-plus", 16);
    document.getElementById("ic-assign").innerHTML = ic("award", 15);
  }

  /* ================= TOOLBAR + TABS ================= */
  function bindToolbar() {
    const inp = document.getElementById("inp-search");
    const acBox = document.getElementById("ac-members");

    // Trie autocomplete: debounce 300ms → GET /members/search/?q=
    const runTrie = Utils.debounce(async () => {
      const q = inp.value.trim();
      if (!q) { hideAc(); return; }
      try {
        const raw = await ApiClient.get("/members/search/", { q });
        // Backend có thể trả mảng thuần hoặc {items:[...]} — xử lý cả hai
        const arr = Array.isArray(raw) ? raw : (raw?.items || []);
        if (!arr.length) { hideAc(); return; }
        acBox.innerHTML = arr.slice(0, 8).map((m) => `
          <div class="ac-item" data-id="${m.id}" data-name="${Utils.escapeHtml(m.ho_ten || "")}">
            <span class="avatar avatar-sm">${Utils.initials(m.ho_ten)}</span>
            <div class="flex-1">
              <div class="ac-title">${Utils.escapeHtml(m.ho_ten || "(không tên)")}</div>
              <div class="ac-sub">${Utils.escapeHtml(m.mssv || "—")} · ${Utils.escapeHtml(m.lop || "—")}</div>
            </div>
          </div>`).join("");
        acBox.classList.remove("hidden");
        Utils.qsa(".ac-item", acBox).forEach((item) => {
          item.addEventListener("click", () => {
            inp.value = item.dataset.name;
            state.search = item.dataset.name;
            state.page = 1;
            hideAc();
            loadMembers();
          });
        });
      } catch { hideAc(); }
    }, 300);

    function hideAc() { acBox.classList.add("hidden"); acBox.innerHTML = ""; }

    inp.addEventListener("input", runTrie);
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        hideAc();
        state.search = inp.value.trim();
        state.page = 1;
        loadMembers();
      }
    });
    // Click ra ngoài → đóng gợi ý
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".searchbar")) hideAc();
    });

    document.getElementById("f-trang-thai").addEventListener("change", (e) => {
      state.trangThai = e.target.value; state.page = 1; loadMembers();
    });
    document.getElementById("f-lop").addEventListener("change", (e) => {
      state.lop = e.target.value; state.page = 1; loadMembers();
    });

    document.getElementById("btn-add").addEventListener("click", openAddModal);
    document.getElementById("btn-import").addEventListener("click", openImportModal);
    document.getElementById("btn-export").addEventListener("click", exportExcel);
    document.getElementById("btn-assign").addEventListener("click", openAssignModal);
  }

  function bindTabs() {
    Utils.qsa(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        Utils.qsa(".tab").forEach((t) => t.classList.toggle("active", t === tab));
        const isMembers = tab.dataset.tab === "members";
        document.getElementById("pane-members").classList.toggle("hidden", !isMembers);
        document.getElementById("pane-board").classList.toggle("hidden", isMembers);
      });
    });
  }

  /* ================= TAB 1: DANH SÁCH THÀNH VIÊN ================= */
  function tableSkeleton(tbody, cols, rows) {
    let html = "";
    for (let i = 0; i < rows; i++) {
      html += `<tr><td colspan="${cols}"><div class="skeleton" style="height:16px;width:${50 + ((i * 17) % 40)}%"></div></td></tr>`;
    }
    tbody.innerHTML = html;
  }

  async function loadMembers() {
    const tbody = document.getElementById("members-tbody");
    const pgBox = document.getElementById("members-pagination");
    tableSkeleton(tbody, 8, 5);
    try {
      const params = { page: state.page };
      if (state.search) params.search = state.search;
      if (state.lop) params.lop = state.lop;
      if (state.trangThai) params.trang_thai_hd = state.trangThai;
      const { items, pagination } = await ApiClient.getList("/members/", params);
      if (!items.length) {
        tbody.innerHTML = "";
        Utils.empty(tbody, { icon: "users", title: "Không tìm thấy thành viên nào", desc: "Thử đổi từ khóa hoặc xóa bộ lọc để xem toàn bộ danh sách." });
        pgBox.querySelector(".page-info").textContent = "";
        pgBox.querySelector(".page-btns").innerHTML = "";
        return;
      }
      collectLopOptions(items);
      tbody.innerHTML = items.map((m) => {
        const [ttLabel, ttTone] = TRANG_THAI[m.trang_thai_hd] || [m.trang_thai_hd, "neutral"];
        const avatar = m.avatar
          ? `<span class="avatar avatar-sm"><img src="${Utils.escapeHtml(m.avatar)}" alt=""></span>`
          : `<span class="avatar avatar-sm">${Utils.initials(m.ho_ten)}</span>`;
        return `
        <tr>
          <td>
            <div class="flex items-center gap-3">
              ${avatar}
              <div class="bold small">${Utils.escapeHtml(m.ho_ten)}</div>
            </div>
          </td>
          <td class="mono">${Utils.escapeHtml(m.mssv || "—")}</td>
          <td>${Utils.escapeHtml(m.lop || "—")}</td>
          <td>${Utils.escapeHtml(m.sdt || "—")}</td>
          <td class="small">${Utils.escapeHtml(m.email || "—")}</td>
          <td class="num"><span class="xp-badge">${Utils.fmtNum(m.xp_points)}</span> <span class="xs muted">XP</span></td>
          <td>${Utils.badge(ttLabel, ttTone)}</td>
          <td class="actions">
            <button class="btn btn-ghost btn-icon act-view" data-id="${m.id}" title="Xem hồ sơ 360°">${ic("eye", 16)}</button>
            <button class="btn btn-ghost btn-icon act-edit" data-id="${m.id}" title="Sửa thông tin">${ic("edit", 16)}</button>
            <button class="btn btn-ghost btn-icon act-status" data-id="${m.id}" data-status="${Utils.escapeHtml(m.trang_thai_hd)}" title="Đổi trạng thái">${ic("shield", 16)}</button>
          </td>
        </tr>`;
      }).join("");
      Utils.qsa(".act-view", tbody).forEach((b) => b.addEventListener("click", () => openProfile360(b.dataset.id)));
      Utils.qsa(".act-edit", tbody).forEach((b) => b.addEventListener("click", () => openEditModal(Number(b.dataset.id))));
      Utils.qsa(".act-status", tbody).forEach((b) => b.addEventListener("click", () => openStatusModal(Number(b.dataset.id), b.dataset.status)));
      renderPagination(pgBox, pagination, (p) => { state.page = p; loadMembers(); });
    } catch (err) {
      tbody.innerHTML = "";
      Utils.empty(tbody, { icon: "alert-triangle", title: "Không tải được danh sách", desc: err.message });
    }
  }

  /* Gom danh sách lớp từ dữ liệu thật để đổ vào select lọc */
  function collectLopOptions(items) {
    const sel = document.getElementById("f-lop");
    const current = state.lop;
    const lops = [...new Set([
      ...Utils.qsa("option", sel).map((o) => o.value).filter(Boolean),
      ...items.map((m) => m.lop).filter(Boolean),
    ])].sort();
    sel.innerHTML = '<option value="">Tất cả lớp</option>' +
      lops.map((l) => `<option value="${Utils.escapeHtml(l)}"${l === current ? " selected" : ""}>${Utils.escapeHtml(l)}</option>`).join("");
  }

  /* Pagination dùng chung */
  function renderPagination(box, pg, onPage) {
    const info = box.querySelector(".page-info");
    const btns = box.querySelector(".page-btns");
    if (!pg || pg.total_pages <= 1) {
      info.textContent = pg ? `${Utils.fmtNum(pg.total_items)} bản ghi` : "";
      btns.innerHTML = "";
      return;
    }
    info.textContent = `Trang ${pg.page}/${pg.total_pages} · ${Utils.fmtNum(pg.total_items)} bản ghi`;
    btns.innerHTML = `
      <button class="btn btn-outline btn-sm" id="pg-prev" ${pg.page <= 1 ? "disabled" : ""}>${ic("chevron-left", 14)}Trước</button>
      <button class="btn btn-outline btn-sm" id="pg-next" ${pg.page >= pg.total_pages ? "disabled" : ""}>Sau${ic("chevron-right", 14)}</button>`;
    btns.querySelector("#pg-prev").addEventListener("click", () => onPage(pg.page - 1));
    btns.querySelector("#pg-next").addEventListener("click", () => onPage(pg.page + 1));
  }

  /* ================= MODAL: THÊM THÀNH VIÊN ================= */
  function openAddModal() {
    openModal({
      title: "Thêm thành viên mới",
      bodyHTML: `
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="add-hoten">Họ và tên <span class="req">*</span></label>
            <input class="form-input" id="add-hoten" placeholder="Nguyễn Văn A">
            <p class="form-error hidden" data-field="ho_ten"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="add-email">Email <span class="req">*</span></label>
            <input class="form-input" type="email" id="add-email" placeholder="ten@student.hueuni.edu.vn">
            <p class="form-error hidden" data-field="email"></p>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="add-mssv">MSSV <span class="req">*</span></label>
            <input class="form-input" id="add-mssv" placeholder="22A401xxx">
            <p class="form-error hidden" data-field="mssv"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="add-pass">Mật khẩu</label>
            <input class="form-input" type="text" id="add-pass" placeholder="Để trống → CLBIP@2026">
            <p class="form-hint">Để trống sẽ dùng mật khẩu mặc định CLBIP@2026.</p>
            <p class="form-error hidden" data-field="password"></p>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="add-lop">Lớp</label>
            <input class="form-input" id="add-lop" placeholder="22A401">
          </div>
          <div class="form-group">
            <label class="form-label" for="add-sdt">Số điện thoại</label>
            <input class="form-input" id="add-sdt" placeholder="09xx xxx xxx">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="add-gt">Giới tính</label>
          <select class="form-select" id="add-gt">
            <option value="">Chưa rõ</option>
            <option value="NAM">Nam</option>
            <option value="NU">Nữ</option>
            <option value="KHAC">Khác</option>
          </select>
        </div>`,
      footerHTML: `<button class="btn btn-ghost" data-close>Đóng</button>
                   <button class="btn btn-primary" id="btn-submit-add">${ic("check", 16)}Thêm thành viên</button>`,
      onMount(modal, close) {
        modal.querySelector("[data-close]").addEventListener("click", close);
        modal.querySelector("#btn-submit-add").addEventListener("click", async () => {
          clearFieldErrors(modal);
          const body = {
            ho_ten: modal.querySelector("#add-hoten").value.trim(),
            email: modal.querySelector("#add-email").value.trim(),
            mssv: modal.querySelector("#add-mssv").value.trim(),
            password: modal.querySelector("#add-pass").value,
            lop: modal.querySelector("#add-lop").value.trim(),
            sdt: modal.querySelector("#add-sdt").value.trim(),
            gioi_tinh: modal.querySelector("#add-gt").value,
          };
          if (!body.ho_ten || !body.email || !body.mssv) {
            Toast.warning("Vui lòng nhập đủ Họ tên, Email và MSSV.");
            return;
          }
          const btn = modal.querySelector("#btn-submit-add");
          const undo = Utils.btnLoading(btn, "Đang thêm...");
          try {
            await ApiClient.post("/members/", body);
            Toast.success(`Đã thêm thành viên ${body.ho_ten}.`);
            close();
            state.page = 1;
            loadMembers();
          } catch (err) {
            showFieldErrors(modal, err.errors);
            Toast.error(err.message);
          } finally {
            undo();
          }
        });
      },
    });
  }

  /* ================= MODAL: HỒ SƠ 360° ================= */
  async function openProfile360(id) {
    const modal = openModal({
      title: "Hồ sơ 360°",
      bodyHTML: `<div class="flex items-center gap-3"><span class="spinner"></span><span class="small muted">Đang tải hồ sơ...</span></div>`,
    });
    try {
      const d = await ApiClient.get(`/members/${id}/profile360/`);
      const body = modal.el.querySelector(".modal-body");
      const s = d.stats || {};
      const [ttLabel, ttTone] = TRANG_THAI[d.trang_thai_hd] || [d.trang_thai_hd, "neutral"];
      const avatar = d.avatar
        ? `<span class="avatar avatar-lg"><img src="${Utils.escapeHtml(d.avatar)}" alt=""></span>`
        : `<span class="avatar avatar-lg">${Utils.initials(d.ho_ten)}</span>`;

      const statsHtml = `
        <div class="p360-stats">
          <div class="p360-stat"><div class="v">${Utils.fmtNum(s.xp_points ?? 0)}</div><div class="l">XP</div></div>
          <div class="p360-stat"><div class="v">${Utils.fmtNum(s.current_level ?? 1)}</div><div class="l">Cấp độ</div></div>
          <div class="p360-stat"><div class="v">🔥 ${Utils.fmtNum(s.streak_count ?? 0)}</div><div class="l">Chuỗi chuyên cần</div></div>
          <div class="p360-stat"><div class="v">${Number(s.attendance_rate_percent ?? 0).toFixed(0)}%</div><div class="l">Tỷ lệ điểm danh</div></div>
          <div class="p360-stat"><div class="v">${Utils.fmtNum(s.events_registered ?? 0)}</div><div class="l">Sự kiện đã đăng ký</div></div>
        </div>`;

      const badges = d.badges || [];
      const badgesHtml = badges.length
        ? badges.map((b) => `<span class="board-chip">${Utils.escapeHtml(b.icon || "🏅")} ${Utils.escapeHtml(b.ten_badge)}</span>`).join("")
        : '<p class="small muted" style="margin:0">Chưa có huy hiệu nào.</p>';

      const xps = d.recent_xp || [];
      const xpHtml = xps.length
        ? xps.map((x) => {
            const amount = Number(x.amount || 0);
            return `<div class="xp-row">
              <span>${Utils.escapeHtml(x.reason || "—")}</span>
              <span class="${amount >= 0 ? "xp-plus" : "xp-minus"}">${amount >= 0 ? "+" : "−"}${Utils.fmtNum(Math.abs(amount))} XP · <span class="muted">${Utils.timeAgo(x.created_at)}</span></span>
            </div>`;
          }).join("")
        : '<p class="small muted" style="margin:0">Chưa có lịch sử XP.</p>';

      const positions = d.board_positions || [];
      const posHtml = positions.length
        ? positions.map((p) => `<span class="board-chip">${ic("crown", 13)} ${Utils.escapeHtml(CHUC_VU[p.chuc_vu] || p.chuc_vu)} · ${Utils.escapeHtml(BAN_PT[p.ban_phu_trach] || p.ban_phu_trach || "—")}${p.nhiem_ky ? ` (${Utils.escapeHtml(p.nhiem_ky)})` : ""}</span>`).join("")
        : "";

      body.innerHTML = `
        <div class="p360-head">
          ${avatar}
          <div>
            <div class="flex items-center gap-2 wrap">
              <h3 style="margin:0">${Utils.escapeHtml(d.ho_ten)}</h3>
              ${Utils.badge(ttLabel, ttTone)}
            </div>
            <div class="small muted mt-2">${Utils.escapeHtml(d.lop || "—")} · MSSV ${Utils.escapeHtml(d.mssv || "—")} · ${Utils.escapeHtml(d.email || "")}</div>
          </div>
        </div>
        ${statsHtml}
        <div class="p360-section-title">Huy hiệu</div>
        <div>${badgesHtml}</div>
        <div class="p360-section-title">Lịch sử XP gần đây</div>
        <div>${xpHtml}</div>
        ${posHtml ? `<div class="p360-section-title">Chức vụ trong Ban chủ nhiệm</div><div>${posHtml}</div>` : ""}`;
    } catch (err) {
      modal.el.querySelector(".modal-body").innerHTML =
        `<div class="empty"><div class="empty-icon">${ic("alert-triangle")}</div><h3>Không tải được hồ sơ</h3><p>${Utils.escapeHtml(err.message)}</p></div>`;
    }
  }

  /* ================= TAB 2: BAN CHỦ NHIỆM ================= */
  async function loadBoard() {
    const tbody = document.getElementById("board-tbody");
    tableSkeleton(tbody, 5, 4);
    try {
      const { items } = await ApiClient.getList("/members/board/");
      if (!items.length) {
        tbody.innerHTML = "";
        Utils.empty(tbody, { icon: "award", title: "Chưa có cơ cấu Ban chủ nhiệm", desc: "Gán chức vụ đầu tiên cho thành viên của nhiệm kỳ này.", actionLabel: "Gán chức vụ", onAction: openAssignModal });
        return;
      }
      tbody.innerHTML = items.map((b) => `
        <tr>
          <td class="bold small">${Utils.escapeHtml(b.member_ho_ten || "—")}</td>
          <td class="mono">${Utils.escapeHtml(b.member_mssv || "—")}</td>
          <td>${Utils.badge(b.chuc_vu_display || CHUC_VU[b.chuc_vu] || b.chuc_vu, "accent")}</td>
          <td>${Utils.escapeHtml(b.ban_phu_trach_display || BAN_PT[b.ban_phu_trach] || "—")}</td>
          <td>${Utils.escapeHtml(b.nhiem_ky || "—")}</td>
        </tr>`).join("");
    } catch (err) {
      tbody.innerHTML = "";
      Utils.empty(tbody, { icon: "alert-triangle", title: "Không tải được Ban chủ nhiệm", desc: err.message });
    }
  }

  /* ================= MODAL: GÁN CHỨC VỤ ================= */
  function openAssignModal() {
    openModal({
      title: "Gán chức vụ Ban chủ nhiệm",
      bodyHTML: `
        <div class="form-group">
          <label class="form-label" for="as-search">Thành viên <span class="req">*</span></label>
          <div class="autocomplete">
            <input class="form-input" id="as-search" placeholder="Gõ tên hoặc MSSV để tìm…" autocomplete="off">
            <div class="ac-list hidden" id="as-ac"></div>
          </div>
          <div id="as-picked"></div>
          <p class="form-error hidden" data-field="member"></p>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="as-chucvu">Chức vụ <span class="req">*</span></label>
            <select class="form-select" id="as-chucvu">
              ${Object.entries(CHUC_VU).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
            </select>
            <p class="form-error hidden" data-field="chuc_vu"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="as-ban">Ban phụ trách <span class="req">*</span></label>
            <select class="form-select" id="as-ban">
              ${Object.entries(BAN_PT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
            </select>
            <p class="form-hint">Ban chuyên môn mà thành viên này phụ trách trong nhiệm kỳ.</p>
            <p class="form-error hidden" data-field="ban_phu_trach"></p>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="as-nhiemky">Nhiệm kỳ</label>
          <input class="form-input" id="as-nhiemky" value="2025-2026" placeholder="VD: 2025-2026">
          <p class="form-error hidden" data-field="nhiem_ky"></p>
        </div>`,
      footerHTML: `<button class="btn btn-ghost" data-close>Đóng</button>
                   <button class="btn btn-primary" id="btn-submit-assign">${ic("check", 16)}Gán chức vụ</button>`,
      onMount(modal, close) {
        let pickedId = null;
        const inp = modal.querySelector("#as-search");
        const acBox = modal.querySelector("#as-ac");
        const pickedBox = modal.querySelector("#as-picked");

        const runTrie = Utils.debounce(async () => {
          const q = inp.value.trim();
          if (!q) { acBox.classList.add("hidden"); acBox.innerHTML = ""; return; }
          try {
            const raw = await ApiClient.get("/members/search/", { q });
            const arr = Array.isArray(raw) ? raw : (raw?.items || []);
            acBox.innerHTML = arr.slice(0, 8).map((m) => `
              <div class="ac-item" data-id="${m.id}" data-name="${Utils.escapeHtml(m.ho_ten || "")}" data-mssv="${Utils.escapeHtml(m.mssv || "")}">
                <span class="avatar avatar-sm">${Utils.initials(m.ho_ten)}</span>
                <div class="flex-1">
                  <div class="ac-title">${Utils.escapeHtml(m.ho_ten || "(không tên)")}</div>
                  <div class="ac-sub">${Utils.escapeHtml(m.mssv || "—")} · ${Utils.escapeHtml(m.lop || "—")}</div>
                </div>
              </div>`).join("");
            acBox.classList.remove("hidden");
            Utils.qsa(".ac-item", acBox).forEach((item) => {
              item.addEventListener("click", () => {
                pickedId = Number(item.dataset.id);
                inp.value = item.dataset.name;
                pickedBox.innerHTML = `<div class="picked-member">${ic("user-check", 15)} Đã chọn: ${Utils.escapeHtml(item.dataset.name)} (${Utils.escapeHtml(item.dataset.mssv || "—")})</div>`;
                acBox.classList.add("hidden");
                acBox.innerHTML = "";
              });
            });
          } catch { acBox.classList.add("hidden"); }
        }, 300);
        inp.addEventListener("input", runTrie);

        modal.querySelector("[data-close]").addEventListener("click", close);
        modal.querySelector("#btn-submit-assign").addEventListener("click", async () => {
          clearFieldErrors(modal);
          if (!pickedId) { Toast.warning("Vui lòng chọn thành viên từ gợi ý tìm kiếm."); return; }
          const btn = modal.querySelector("#btn-submit-assign");
          const undo = Utils.btnLoading(btn, "Đang gán...");
          try {
            await ApiClient.post("/members/board/", {
              member: pickedId,
              chuc_vu: modal.querySelector("#as-chucvu").value,
              ban_phu_trach: modal.querySelector("#as-ban").value,
              nhiem_ky: modal.querySelector("#as-nhiemky").value.trim(),
            });
            Toast.success("Đã gán chức vụ thành công.");
            close();
            loadBoard();
          } catch (err) {
            showFieldErrors(modal, err.errors);
            Toast.error(err.message);
          } finally {
            undo();
          }
        });
      },
    });
  }

  /* ================= NHẬP / XUẤT EXCEL ================= */
  function openImportModal() {
    openModal({
      title: "Nhập thành viên từ Excel",
      bodyHTML: `
        <div class="form-group">
          <label class="form-label" for="imp-file">Chọn file .xlsx <span class="req">*</span></label>
          <input class="form-input" type="file" id="imp-file" accept=".xlsx">
          <p class="form-hint">Hàng 1 là tiêu đề cột: ho_ten | email | mssv | lop | sdt. Tối đa 5MB.</p>
          <p class="form-error hidden" data-field="file"></p>
        </div>
        <div id="imp-result"></div>`,
      footerHTML: `<button class="btn btn-ghost" data-close>Đóng</button>
                   <button class="btn btn-primary" id="btn-submit-import">${ic("upload", 16)}Nhập file</button>`,
      onMount(modal, close) {
        modal.querySelector("[data-close]").addEventListener("click", close);
        modal.querySelector("#btn-submit-import").addEventListener("click", async () => {
          clearFieldErrors(modal);
          const fileInput = modal.querySelector("#imp-file");
          const resultBox = modal.querySelector("#imp-result");
          if (!fileInput.files || !fileInput.files[0]) {
            Toast.warning("Vui lòng chọn file Excel (.xlsx).");
            return;
          }
          const btn = modal.querySelector("#btn-submit-import");
          const undo = Utils.btnLoading(btn, "Đang nhập...");
          try {
            const fd = new FormData();
            fd.append("file", fileInput.files[0]);
            const res = await ApiClient.post("/members/import-excel/", fd);
            const created = res?.created ?? 0;
            const errors = res?.errors || [];
            resultBox.innerHTML = `
              <div class="import-result mt-4">
                <div class="bold">Kết quả nhập: <span class="xp-badge">${Utils.fmtNum(created)}</span> thành viên mới.</div>
                ${errors.length
                  ? `<div class="mt-2">${Utils.fmtNum(errors.length)} dòng lỗi:<ul class="mb-0" style="padding-left:18px">${errors.map((e) => `<li class="err-line">${Utils.escapeHtml(typeof e === "string" ? e : JSON.stringify(e))}</li>`).join("")}</ul></div>`
                  : '<div class="mt-2 small muted">Không có dòng lỗi nào.</div>'}
              </div>`;
            Toast.success(`Nhập Excel hoàn tất: ${Utils.fmtNum(created)} thành viên mới.`);
            state.page = 1;
            loadMembers();
          } catch (err) {
            showFieldErrors(modal, err.errors);
            Toast.error(err.message);
          } finally {
            undo();
          }
        });
      },
    });
  }

  async function exportExcel() {
    const btn = document.getElementById("btn-export");
    const undo = Utils.btnLoading(btn, "Đang xuất...");
    try {
      await ApiClient.download("/members/export-excel/", "thanh_vien.xlsx");
      Toast.success("Đã xuất danh sách thành viên ra file Excel.");
    } catch (err) {
      Toast.error(err.message);
    } finally {
      undo();
    }
  }

  /* Guard chạy xong mới khởi tạo state (CONTRACT §1) */
  Auth.requireRole(["ADMIN", "BCN"]).then(init).catch(() => {});
})();
</script>
