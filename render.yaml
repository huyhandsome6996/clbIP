# =====================================================================
# Render Blueprint — CLB IP ĐHSP Huế 2.0 Backend
# Deploy: Render Dashboard → New + → Blueprint → chọn repo này → Apply
# Tự động tạo: 1 Web Service (Django API) + 1 PostgreSQL (free plan)
# =====================================================================
services:
  - type: web
    name: clbip-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 30"
    healthCheckPath: /api/health/
    envVars:
      # Phiên bản Python đã kiểm thử đầy đủ (227 tests pass trên 3.12.x)
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Đồng bộ với mặc định trong core/settings.py §7 — thêm domain frontend
      # thật nếu khác các domain dưới đây
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://clbip-frontend.onrender.com,https://clbip-backend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # 1 reverse proxy phía trước → IP client thật là phần tử CUỐI X-Forwarded-For
      # (throttle DRF + django-axes nhận diện đúng IP thật, chống giả mạo header)
      - key: NUM_PROXIES
        value: "1"
      # KHÔNG đặt SEED_DEMO trên production — build.sh chỉ seed khi
      # SEED_DEMO=1 VÀ DJANGO_ENV != production (chặn tài khoản demo, xem README)
      - key: DATABASE_URL
        fromDatabase:
          name: clbip-postgres
          property: connectionString
      # ---------------------------------------------------------------
      # File upload bền vững (QA-Audit P2-3): đĩa Render là TẠM THỜI —
      # tài liệu/ảnh upload MẤT khi restart. Production bắt buộc 1 trong 2:
      #   (a) Đặt USE_S3=1 + AWS_* bên dưới (S3/Cloudflare R2 — khuyến nghị);
      #   (b) Đặt ALLOW_EPHEMERAL_UPLOADS=1 nếu chấp nhận MẤT file khi
      #       restart (chỉ demo/pilot).
      # Không cấu hình gì → upload tài liệu bị chặn 400 kèm hướng dẫn
      # (fail loud — không im lặng nhận file rồi mất).
      # ⚠️ Giá trị thật đặt trong Render Dashboard sau khi Apply Blueprint
      # (sync: false — KHÔNG bao giờ ghi secret trong blueprint).
      # ---------------------------------------------------------------
      - key: USE_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false   # R2/MinIO: https://<account>.r2.cloudflarestorage.com
      - key: AWS_S3_REGION_NAME
        sync: false   # R2: auto
      - key: ALLOW_EPHEMERAL_UPLOADS
        sync: false   # chỉ đặt "1" khi chấp nhận mất file demo

databases:
  - name: clbip-postgres
    plan: free
    databaseName: clbip
    user: clbip
