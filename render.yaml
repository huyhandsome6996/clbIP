# =====================================================================
# Render Blueprint — CLB IP ĐHSP Huế 2.0 Backend
# Deploy: Render Dashboard → New + → Blueprint → chọn repo này → Apply
# Tự động tạo: 1 Web Service (Django API) + 1 PostgreSQL (free plan)
# =====================================================================
services:
  - type: web
    name: clbip-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 30"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://clbip-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: clbip-postgres
          property: connectionString

databases:
  - name: clbip-postgres
    plan: free
    databaseName: clbip
    user: clbip
